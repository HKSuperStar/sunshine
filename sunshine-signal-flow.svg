<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sun-Shine 智能增长信号流</title>
  <desc id="desc">从用户问题和商品事实，经过智能理解与增长执行，汇聚到结果归因，再反馈到下一轮增长。</desc>
  <defs>
    <linearGradient id="goldFlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4B82C" stop-opacity=".2"/><stop offset=".48" stop-color="#F4B82C"/><stop offset="1" stop-color="#0B2657" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="blueFlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0B2657" stop-opacity=".1"/><stop offset=".5" stop-color="#436A9F"/><stop offset="1" stop-color="#F4B82C"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M104 210C190 80 282 80 368 210S548 340 634 210 814 80 900 210" stroke="#D8E5DD" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 210C190 80 282 80 368 210S548 340 634 210 814 80 900 210" stroke="url(#goldFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 120">
    <animate attributeName="stroke-dashoffset" from="0" to="-132" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M104 210C190 340 282 340 368 210S548 80 634 210 814 340 900 210" stroke="#D8E5DD" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 210C190 340 282 340 368 210S548 80 634 210 814 340 900 210" stroke="url(#blueFlow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 120">
    <animate attributeName="stroke-dashoffset" from="-132" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#softGlow)"><circle cx="104" cy="210" r="52" fill="#FFF" stroke="#0B2657" stroke-width="3"/><circle cx="104" cy="210" r="42" fill="#F4B82C" fill-opacity=".16"/></g>
  <g filter="url(#softGlow)"><circle cx="368" cy="210" r="58" fill="#FFF" stroke="#436A9F" stroke-width="3"/><circle cx="368" cy="210" r="46" fill="#436A9F" fill-opacity=".11"/></g>
  <g filter="url(#softGlow)"><circle cx="634" cy="210" r="58" fill="#FFF" stroke="#F4B82C" stroke-width="3"/><circle cx="634" cy="210" r="46" fill="#F4B82C" fill-opacity=".15"/></g>
  <g filter="url(#softGlow)"><circle cx="900" cy="210" r="52" fill="#FFF" stroke="#0B2657" stroke-width="3"/><circle cx="900" cy="210" r="42" fill="#0B2657" fill-opacity=".08"/></g>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle" fill="#10254A">
    <text x="104" y="205" font-size="15" font-weight="700">用户问题</text><text x="104" y="226" font-size="11" fill="#718197">Prompt</text>
    <text x="368" y="205" font-size="15" font-weight="700">智能理解</text><text x="368" y="226" font-size="11" fill="#718197">Knowledge</text>
    <text x="634" y="205" font-size="15" font-weight="700">增长执行</text><text x="634" y="226" font-size="11" fill="#718197">Mission</text>
    <text x="900" y="205" font-size="15" font-weight="700">结果归因</text><text x="900" y="226" font-size="11" fill="#718197">Outcome</text>
  </g>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle" font-size="11" fill="#718197"><text x="236" y="62">识别意图</text><text x="502" y="365">组织动作</text><text x="767" y="62">沉淀证据</text></g>
</svg>
